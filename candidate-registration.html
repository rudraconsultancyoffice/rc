<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Candidate Registration | Rudra Consultancy</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>Rudra Consultancy</h1>

</header>



<section>


<h2>Candidate Registration</h2>



<form id="candidateForm">


<input 
type="text"
id="name"
placeholder="Full Name"
required>


<br><br>



<input 
type="tel"
id="mobile"
placeholder="Mobile Number"
required>


<br><br>



<input 
type="email"
id="email"
placeholder="Email Address">


<br><br>



<input 
type="text"
id="qualification"
placeholder="Qualification">


<br><br>



<input 
type="text"
id="preferredJob"
placeholder="Preferred Job">


<br><br>



<button type="submit">
Register
</button>



</form>



<p id="message"></p>



<br>


<a href="index.html">
⬅ Back to Home
</a>



</section>




<script type="module">


import { db } from "./firebase-config.js";

import {
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const form =
document.getElementById("candidateForm");

const message =
document.getElementById("message");



form.addEventListener("submit", async(e)=>{


e.preventDefault();



try{


await addDoc(
collection(db,"candidates"),
{

name:
document.getElementById("name").value,

mobile:
document.getElementById("mobile").value,

email:
document.getElementById("email").value,

qualification:
document.getElementById("qualification").value,

preferredJob:
document.getElementById("preferredJob").value,


createdAt:
new Date()

}

);



message.innerText =
"Registration Successful";

message.style.color =
"green";



form.reset();



}


catch(error){


console.log(error);


message.innerText =
"Registration Failed";


message.style.color =
"red";


}



});


</script>



</body>

</html>
