<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employer Registration | Rudra Consultancy</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<header>

<h1>Rudra Consultancy</h1>

</header>



<section>


<h2>Employer Registration</h2>



<form id="employerForm">


<input
type="text"
id="companyName"
placeholder="Company Name"
required>


<br><br>



<input
type="text"
id="contactPerson"
placeholder="HR Name"
required>


<br><br>



<input
type="tel"
id="mobile"
placeholder="Mobile Number"
required>


<br><br>



<input
type="email"
id="email"
placeholder="Email Address">


<br><br>



<input
type="text"
id="address"
placeholder="Office Address">


<br><br>



<textarea
id="vacancyDetails"
placeholder="Job Vacancy Details"></textarea>


<br><br>



<button type="submit">
Submit
</button>



</form>



<p id="message"></p>



<br>


<a href="index.html">
⬅ Back to Home
</a>



</section>



<footer>

<p>
© 2026 Rudra Consultancy. All Rights Reserved.
</p>

</footer>




<script type="module">


import { db } from "./firebase-config.js";


import {
collection,
addDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



const form =
document.getElementById("employerForm");


const message =
document.getElementById("message");



form.addEventListener("submit", async(e)=>{


e.preventDefault();



try{


await addDoc(

collection(db,"employers"),

{


companyName:
document.getElementById("companyName").value,


contactPerson:
document.getElementById("contactPerson").value,


mobile:
document.getElementById("mobile").value,


email:
document.getElementById("email").value,


address:
document.getElementById("address").value,


vacancyDetails:
document.getElementById("vacancyDetails").value,


createdAt:
new Date()


}

);



message.innerText =
"Employer Registration Successful";


message.style.color =
"green";



form.reset();



}


catch(error){


console.log(error);


message.innerText =
"Registration Failed";


message.style.color =
"red";


}



});


</script>



</body>

</html>
